name: SEO check

# Runs the claude-seo checks against our site.
#
# quick-checks: the plugin's deterministic Python checks (on-page, TLS and
#   security headers, sitemaps, AI agent readiness). Free, no secrets needed.
#   Results appear on the run's Summary page and as a downloadable artifact.
#
# full-audit: the full `/seo audit` run by Claude Code with this plugin loaded.
#   Only runs when the ANTHROPIC_API_KEY repository secret is set. The report
#   is uploaded as an artifact named seo-audit-report.
#
# Change the site by setting a repository variable named SITE_URL
# (Settings > Secrets and variables > Actions > Variables), or type a URL when
# starting the workflow by hand.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      url:
        description: "Site URL (leave blank to use SITE_URL / the default)"
        required: false
      full_audit:
        description: "Also run the full Claude audit (needs ANTHROPIC_API_KEY)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  SITE_URL: ${{ inputs.url || vars.SITE_URL || 'https://www.simpleonlinepharmacy.co.uk/' }}

jobs:
  quick-checks:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checks
        # Each check can exit non-zero when it finds problems; keep going so
        # every result is collected.
        run: |
          mkdir -p results
          python scripts/page_checks.py --url "$SITE_URL" > results/page.json || true
          python scripts/transport_check.py "$SITE_URL" --json > results/transport.json || true
          python scripts/sitemap_discovery.py "$SITE_URL" --json > results/sitemap.json || true
          python scripts/agentic_check.py "$SITE_URL" --json > results/agentic.json || true

      - name: Write summary
        run: |
          {
            echo "Site: $SITE_URL"
            echo
            python .github/seo/summarize.py results
          } | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: seo-quick-checks
          path: results/
          retention-days: 90

  full-audit:
    name: Full Claude audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || inputs.full_audit
    steps:
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Skipping full audit: add an ANTHROPIC_API_KEY repository secret to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Prepare plugin runtime
        if: steps.key.outputs.present == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run /seo audit
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --plugin-dir ${{ github.workspace }}
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Agent,Skill,TodoWrite
          prompt: |
            Run `/seo audit ${{ env.SITE_URL }}` using the claude-seo plugin loaded from this repository.
            Python dependencies and Playwright Chromium are already installed for the system `python`;
            if the plugin's runtime launcher needs setup, run `/seo setup` first.
            This is a non-interactive CI run: do not ask questions, and do not edit, commit or push
            any repository files.
            Write the final report as Markdown to `seo-report/audit.md` (create the folder), with the
            overall score, a prioritised action plan, and every finding with its evidence.
            Save any other files the audit produces (screenshots, JSON) under `seo-report/` too.

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: seo-audit-report
          path: seo-report/
          if-no-files-found: warn
          retention-days: 90

      - name: Add report to summary
        if: always() && steps.key.outputs.present == 'true'
        run: |
          if [ -f seo-report/audit.md ]; then
            cat seo-report/audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
